<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Haunted Pop-up Card</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--ink:#2a1840;--cream:#fff4dc;--card:#3b2459;--card-dark:#26153d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 38%,#7a4a2c 0%,#4a2c1a 55%,#24150d 100%);font-family:"Nunito",system-ui,sans-serif;color:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none;outline:none}
.btn{font-family:"Chewy",cursive;font-size:22px;color:var(--cream);background:#e9782a;border:none;border-radius:14px;padding:10px 24px;cursor:pointer;
  box-shadow:0 5px 0 #a24a12,0 10px 18px rgba(0,0,0,.35);transform:rotate(-1.5deg);transition:transform .15s}
.btn:hover{transform:rotate(1deg) scale(1.04)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a24a12}
#ui{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:10px;pointer-events:none;z-index:3}
#ui .btn{pointer-events:auto}
#mute,#music{position:fixed;right:14px;top:14px;z-index:3;font-size:18px;padding:8px 13px;background:var(--card);box-shadow:0 4px 0 var(--card-dark)}
#music{top:66px}
#music.off{opacity:.45}
/* sticker book */
#shelf{position:fixed;left:50%;top:12px;transform:translateX(-50%) rotate(-.6deg);z-index:3;display:flex;align-items:center;gap:10px;
  background:#4a2d6e;background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.06) 0 2px,transparent 3px);background-size:18px 18px;
  border-radius:18px;padding:8px 14px 8px 12px;box-shadow:0 4px 0 #2b1845,0 12px 24px rgba(0,0,0,.35);outline:2px dashed rgba(255,230,180,.45);outline-offset:-6px;
  transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .4s}
#shelf.hide{transform:translate(-50%,-140%);opacity:0}
.shelf-title{font-family:"Chewy",cursive;color:#ffd27a;font-size:17px;line-height:1;text-align:center;white-space:nowrap}
.shelf-title b{display:block;font-weight:400;font-size:24px;color:#fff4dc}
#stickers{display:flex;gap:7px}
.stk{position:relative;width:48px;height:48px;border-radius:50%;border:none;padding:0;cursor:pointer;background:rgba(255,244,220,.12);
  box-shadow:inset 0 0 0 2px rgba(255,230,180,.35);transition:transform .2s}
.stk:hover{transform:scale(1.12) rotate(-4deg)}
.stk img{position:absolute;inset:6px;width:36px;height:36px;object-fit:contain;filter:brightness(0) invert(.85) opacity(.28)}
.stk::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:"Chewy",cursive;font-size:20px;color:rgba(255,230,180,.7)}
.stk.got{background:#fff4dc;box-shadow:0 0 0 3px #fff,0 3px 0 3px rgba(0,0,0,.25)}
.stk.got img{filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.stk.got::after{content:none}
.stk.stamp{animation:stamp .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{0%{transform:scale(2.2) rotate(-25deg);opacity:0}60%{transform:scale(.9) rotate(6deg);opacity:1}100%{transform:none}}
/* fact / clue card */
#fact{position:fixed;right:16px;bottom:84px;z-index:4;width:300px;background:#fff7e6;border-radius:16px;padding:14px 16px 14px 92px;
  box-shadow:0 5px 0 rgba(42,24,64,.25),0 14px 30px rgba(0,0,0,.35);transform:rotate(1.2deg);transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .3s;
  background-image:repeating-linear-gradient(transparent 0 25px,rgba(107,63,160,.12) 25px 26px)}
#fact.hidden{transform:translateX(130%) rotate(8deg);opacity:0;pointer-events:none}
#fact img{position:absolute;left:14px;top:16px;width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
#fact.clue img{filter:brightness(0) opacity(.35)}
#factKind{font-family:"Chewy",cursive;font-size:14px;color:#e9782a;letter-spacing:.5px}
#factTitle{margin:0 0 4px;font-family:"Chewy",cursive;font-weight:400;font-size:24px;color:#4a2d6e}
#factText{margin:0;font-size:14.5px;line-height:1.4}
#factTry{margin:8px 0 0;font-size:13.5px;color:#6b3fa0;font-weight:800}
#factTry:empty{display:none}
#factClose{position:absolute;right:8px;top:6px;border:none;background:none;font-size:20px;color:#9a86b0;cursor:pointer}
#finale{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);z-index:5;pointer-events:none;text-align:center;
  font-family:"Chewy",cursive;color:#fff4dc;font-size:46px;text-shadow:0 4px 0 #a24a12,0 10px 24px rgba(0,0,0,.4);transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
#finale small{display:block;font-size:22px;color:#ffd27a}
#finale.show{transform:translate(-50%,-50%) scale(1)}
#hint{position:fixed;left:50%;bottom:84px;transform:translate(-50%,0);z-index:2;pointer-events:none;font-family:"Chewy",cursive;font-size:26px;
  color:var(--cream);text-shadow:0 2px 0 var(--card-dark),0 6px 14px rgba(0,0,0,.4);transition:opacity .5s;white-space:nowrap}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.bubble{position:absolute;transform:translate(-50%,-100%) scale(0);transform-origin:50% 100%;background:#fffaf0;border:3px solid var(--ink);
  border-radius:16px;padding:3px 13px;font-family:"Chewy",cursive;font-size:24px;white-space:nowrap;box-shadow:3px 4px 0 rgba(42,24,64,.3);
  animation:bub 1.5s ease forwards}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--ink)}
@keyframes bub{0%{transform:translate(-50%,-100%) scale(0)}15%{transform:translate(-50%,-110%) scale(1.1)}25%{transform:translate(-50%,-110%) scale(1)}
  80%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%) scale(.95)}}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:"Chewy",cursive;font-size:28px;color:var(--cream);background:#3a2316;z-index:9;transition:opacity .6s}
@media (max-width:760px){#shelf{flex-direction:column;gap:4px;padding:6px 8px;width:calc(100% - 24px)}.shelf-title b{display:inline;font-size:18px;margin-left:6px}#stickers{flex-wrap:wrap;justify-content:center;gap:5px}.stk{width:38px;height:38px}.stk img{inset:4px;width:30px;height:30px}#fact{left:12px;right:12px;width:auto;bottom:78px}#hint{font-size:20px}#mute{top:auto;bottom:22px}#music{top:auto;bottom:74px}}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three.module.js",
            "three/addons/":"./vendor/"}}
</script>
</head>
<body>
<div id="loading">Folding paper…</div>
<div id="shelf" class="hide"><div class="shelf-title">Sticker Book<b id="count">0 / 10</b></div><div id="stickers"></div></div>
<div id="fact" class="hidden"><button id="factClose" aria-label="Close">×</button><img id="factImg" alt=""><div id="factKind">Did you know?</div>
  <h4 id="factTitle"></h4><p id="factText"></p><p id="factTry"></p></div>
<div id="finale">You found everyone! 🎉<small>All 10 stickers collected</small></div>
<div id="hint">Click “Open card” to begin ✦</div>
<div id="bubbles"></div>
<button class="btn" id="mute" aria-label="Toggle sound">🔊</button>
<button class="btn" id="music" aria-label="Toggle music">🎵</button>
<div id="ui"><button class="btn" id="toggle">Open card</button></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';

/* ================= basics ================= */
const W = 20, D = 13, H = 13, T = 0.07, INSET = 0.45;   // card: width, floor depth, back height, thickness
const FLOOR_TOP = T;
const DEG = Math.PI / 180;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const A = p => 'assets/v3/' + p, A1 = p => 'assets/layers/' + p;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x2a180f, 45, 95);
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, .1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false;
controls.enableDamping = true;
controls.minDistance = 16; controls.maxDistance = 60;
controls.minPolarAngle = 18 * DEG; controls.maxPolarAngle = 82 * DEG;
controls.minAzimuthAngle = -70 * DEG; controls.maxAzimuthAngle = 70 * DEG;
controls.target.set(0, 3.6, 5.8);
// two framings: looking down at the closed card, and the low 3/4 view of the open scene
function camPose(open) {
  const f = innerWidth / innerHeight < 1 ? 2.7 : 1.24;
  return open ? { pos: new THREE.Vector3(-10 * f, 18 * f, 30 * f), target: new THREE.Vector3(0, 4.6, 5.8) }
              : { pos: new THREE.Vector3(-2 * f, 27 * f, 19 * f), target: new THREE.Vector3(0, 0, 6.2) };
}
function placeCamera() { const c = camPose(false); camera.position.copy(c.pos); controls.target.copy(c.target); controls.update(); }
placeCamera();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* lights: warm key from upper-left front, soft room fill */
scene.add(new THREE.HemisphereLight(0xffe9cf, 0x3b2216, 1.1));
const key = new THREE.DirectionalLight(0xffe0b5, 2.6);
key.position.set(-13, 21, 16);
key.target.position.set(0, 2, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 1, far: 70 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xb7a6ff, .55);
fill.position.set(16, 9, 10);
scene.add(fill);

/* ================= textures ================= */
const loadImg = src => new Promise(res => {
  const i = new Image(); i.onload = () => res(i);
  i.onerror = () => { const c = document.createElement('canvas'); c.width = c.height = 8; const g = c.getContext('2d'); g.fillStyle = '#c9b'; g.fillRect(0, 0, 8, 8); res(c); };
  i.src = src;
});
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(src, srgb = true) {
  const t = new THREE.Texture(src); t.needsUpdate = true;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
// fine paper grain used as a bump map on every sheet
const paperBump = (() => {
  const [c, g] = canvas(256, 256); const d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = 120 + Math.random() * 60; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0);
  g.globalAlpha = .08; g.strokeStyle = '#fff';
  for (let i = 0; i < 90; i++) { g.beginPath(); const x = Math.random() * 256, y = Math.random() * 256; g.moveTo(x, y); g.lineTo(x + Math.random() * 40 - 20, y + Math.random() * 6); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 6); return t;
})();
const paper = (opts = {}) => new THREE.MeshStandardMaterial({ roughness: .9, metalness: 0, bumpMap: paperBump, bumpScale: .6, ...opts });

// mask of the warm-yellow window pixels, used as an emissive map so windows glow
function glowMask(img, test = (r, g, b) => r > 215 && g > 160 && b < 150) {
  const [c, g] = canvas(img.width, img.height); g.drawImage(img, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < d.data.length; i += 4) {
    const on = d.data[i + 3] > 100 && test(d.data[i], d.data[i + 1], d.data[i + 2]);
    d.data[i] = d.data[i + 1] = d.data[i + 2] = on ? 255 : 0; d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0); return tex(c);
}
// cream silhouette for the unprinted back of a cut-out
function silhouette(img, color = '#efe2cc') {
  const [c, g] = canvas(img.width, img.height); g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return tex(c);
}
function alphaData(img) {
  const w = 128, h = Math.max(1, Math.round(128 * img.height / img.width));
  const [c, g] = canvas(w, h); g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data, a = new Uint8Array(w * h);
  for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3];
  return { a, w, h };
}

/* a die-cut paper piece: printed front, plain back, cut-out shadow */
function cutout(img, height, { emissive = null, role = null } = {}) {
  const t = tex(img), w = height * img.width / img.height;
  const geo = new THREE.PlaneGeometry(w, height); geo.translate(0, height / 2, 0);
  const mat = paper({ map: t, alphaTest: .5, bumpScale: .35 });
  if (emissive) Object.assign(mat, { emissiveMap: emissive, emissive: new THREE.Color(0xffb347), emissiveIntensity: 1 });
  const front = new THREE.Mesh(geo, mat);
  front.position.z = .014; front.castShadow = front.receiveShadow = true;
  front.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: t, alphaTest: .5 });
  const back = new THREE.Mesh(geo, paper({ map: silhouette(img), alphaTest: .5 }));
  back.rotation.y = Math.PI; back.position.z = -.014; back.receiveShadow = true;
  const g = new THREE.Group(); g.add(front, back);
  const ad = alphaData(img); front.userData.alpha = back.userData.alpha = ad;
  if (role) g.userData.role = role;
  return Object.assign(g, { w, h: height, front, mat });
}

// an invisible, slightly oversized touch target so small pieces are easy to hit
function hitPad(w, h, role) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, colorWrite: false }));
  m.userData.role = role; pick.push(m); return m;
}

/* ================= the fold =================
   Every pop-up piece is authored in its fully-open pose inside `fold`
   (x = across, y = up the back panel, z = out along the floor).
   As the card closes, the frame shears exactly like a parallel-fold
   pop-up: lines parallel to the back panel stay parallel to it, lines
   parallel to the floor stay on/parallel to the floor, and at 0° it all
   lies flat. */
const folds = [];
function makeFold(stiff, damp) {
  const g = new THREE.Group(); g.matrixAutoUpdate = false; g.userData.sp = { a: 0, v: 0, stiff, damp };
  scene.add(g); folds.push(g); return g;
}
function setFold(g, alpha) {
  const a = Math.max(alpha, .6) * DEG, s = Math.sin(a), c = Math.cos(a);
  g.matrix.set(1, 0, 0, 0,  0, s, 0, FLOOR_TOP,  0, c, 1, 0,  0, 0, 0, 1);
  g.matrixWorldNeedsUpdate = true;
}
// each group springs toward the card angle with its own stiffness, so the
// pieces rise one after another and settle with a small papery bounce
function updateFolds(dt) {
  for (const g of folds) {
    const sp = g.userData.sp;
    sp.v += ((S.alpha - sp.a) * sp.stiff - sp.v * sp.damp) * dt; sp.a += sp.v * dt;
    sp.a = clamp(sp.a, 0, Math.min(100, S.alpha + (S.alpha > 80 ? 9 : 1.5)));   // never pokes through a closing cover
    setFold(g, sp.a); g.visible = S.alpha > 1.2;
  }
}
const fold = makeFold(160, 18), foldTree = makeFold(70, 6.5), foldHouse = makeFold(48, 4.8), foldBridge = makeFold(85, 7.5);

/* ================= state ================= */
const S = {
  alpha: 0, tween: null,
  pull: 0, pullV: 0, pulling: false,
  door: 0, doorTween: null,
  catMode: 'hidden', catPop: 0, catWalk: 0, catFacing: 1, routeN: 0,
  spiderL: 1.5, spiderV: 0, spiderDrag: false,
  dial: 188 * DEG, dialSpin: 0,
  wheel: 0, face: 0, glow: 1,
  ghostSpin: 0, owlT: 0, graveT: [0, 0], catHop: 0, batPh: [0, 0, 0], batBoost: 0,
};
/* sticker book: every discovery unlocks a sticker with a science fact */
const STICKERS = [
  { id: 'ghost', from: 'tab', alt: 'ghost', img: A1('ghost.webp'), name: 'Ghost', clue: 'Tap the little ghost peeking out of the chimney, or pull the paper tab at the front!',
    fact: "Ghosts aren't real, but spooky floating lights over swamps are! Scientists think gas from rotting plants can glow in the dark.", tryit: 'Can you float around the room like a ghost? Wooo~' },
  { id: 'cat', from: 'door', img: A1('cat.webp'), name: 'Black cat', clue: 'Somebody is hiding behind the house door. Open it!',
    fact: 'Cats can jump up to six times their own body length in one leap!', tryit: 'Click the cat to send it on an adventure.' },
  { id: 'pumpkin', from: 'wheel', img: A1('pumpkin.webp'), name: 'Pumpkin', clue: 'Turn the purple wheel next to the big pumpkin.',
    fact: 'A pumpkin is a fruit, not a vegetable. It grows from a flower and keeps its seeds inside.', tryit: 'Turn the wheel to find all 4 faces.' },
  { id: 'witch', from: 'dial', img: A1('witch.webp'), name: 'The Moon', clue: 'Spin the paper dial in the sky.',
    fact: "The Moon doesn't make its own light. It shines because sunlight bounces off it!", tryit: 'Fly the witch all the way across the moon.' },
  { id: 'bat', from: 'bat', img: A1('bat.webp'), name: 'Bat', clue: 'Tap a bat flying around the moon.',
    fact: 'Bats are the only mammals that can really fly. Many find bugs in the dark by listening to echoes.', tryit: 'Clap in a big empty room. Can you hear an echo?' },
  { id: 'owl', from: 'owl', img: A1('owl.webp'), name: 'Owl', clue: 'Someone up in the tree is wide awake… tap them!',
    fact: 'Owls can turn their heads about 270°, almost all the way around!', tryit: 'How far can YOU turn your head? (Gently!)' },
  { id: 'spider', from: 'spider', img: A1('spider.webp'), name: 'Spider', clue: 'Pull the little spider down on its thread.',
    fact: 'Spiders have 8 legs but insects have only 6, so a spider is not an insect!', tryit: "Count the spider's legs." },
  { id: 'grave', from: 'grave', img: A('gravestone.webp'), name: 'Old stone', clue: 'One gravestone is very ticklish…',
    fact: 'The crusty spots on old stones are lichen: a fungus and an alga living together as a team!', tryit: 'Look for lichen on rocks and trees outside.' },
  { id: 'candy', from: 'candy', img: A('candy-bucket.webp'), name: 'Candy', clue: 'Somebody left their candy out…',
    fact: 'Candy corn was invented in the 1880s, so it is more than 140 years old!', tryit: 'How many candies spilled out? Count them!' },
  { id: 'fish', from: 'fish', img: A('fish.webp'), name: 'Fish', clue: 'Click the cat. It might go fishing in the stream!',
    fact: 'Fish breathe underwater with gills, which take oxygen out of the water.', tryit: 'Watch the cat go fishing again.' },
];
const used = new Set(), got = new Set();
let factTimer;
function showFact(st, clue = false) {
  const el = document.getElementById('fact');
  el.classList.toggle('clue', clue);
  document.getElementById('factImg').src = st.img;
  document.getElementById('factKind').textContent = clue ? 'Clue 🔍' : 'New sticker! ✦ Did you know?';
  document.getElementById('factTitle').textContent = clue ? 'Who is hiding?' : st.name;
  document.getElementById('factText').textContent = clue ? st.clue : st.fact;
  document.getElementById('factTry').textContent = clue ? '' : 'Try it: ' + st.tryit;
  el.classList.remove('hidden');
  clearTimeout(factTimer); factTimer = setTimeout(() => el.classList.add('hidden'), clue ? 4500 : 9000);
}
function buildShelf() {
  const box = document.getElementById('stickers');
  for (const st of STICKERS) {
    const b = document.createElement('button'); b.className = 'stk'; b.id = 'stk-' + st.id; b.title = st.name;
    b.innerHTML = `<img src="${st.img}" alt="">`;
    b.onclick = () => got.has(st.id) ? showFact(st) : showFact(st, true);
    box.appendChild(b);
  }
  document.getElementById('factClose').onclick = () => document.getElementById('fact').classList.add('hidden');
}
function discover(id) {
  if (used.has(id)) return; used.add(id);
  sparkles.forEach(s => { if (s.userData.id === id) s.visible = false; });
  const st = STICKERS.find(s => s.from === id || s.alt === id); if (!st || got.has(st.id)) return;
  got.add(st.id);
  const b = document.getElementById('stk-' + st.id); b.classList.add('got', 'stamp');
  document.getElementById('count').textContent = `${got.size} / ${STICKERS.length}`;
  setTimeout(() => { sfx.stamp(); showFact(st); }, 500);
  if (got.size === STICKERS.length) setTimeout(finale, 2200);
}
function finale() {
  const fin = document.getElementById('finale'); fin.classList.add('show'); setTimeout(() => fin.classList.remove('show'), 4200);
  sfx.melody(); S.pullV = 10; S.glow = 2.8; S.owlT = 1; S.graveT = [1, 1]; S.batBoost = 1; spillCandy();
  if (S.catMode === 'idle') S.catHop = 1;
  [ghostObj, owlObj, pumpkin].forEach((o, i) => setTimeout(() => bubble(o, ['Hooray!', 'Hoo-ray!', 'Yay!'][i]), 300 + i * 350));
}

/* ================= build ================= */
const pick = [];            // meshes the pointer can interact with
const blockers = [];        // solid pieces that stop picks behind them
let spiderHit, fishObj, ripple, drops = [], house, lantern, bucket, candies = [], smoke = [], flies = [], leaves = [], glints = [], moonBats = [], pumpkin, catObj, ghostObj, strip, spiderObj, thread, owlObj, witch, bats = [], dial, wheel, tab, door, faceMat, pumpkinLight, catPath, graves = [];
const sparkles = [];

async function build() {
  await document.fonts.load('80px Chewy').catch(() => {});
  const names = ['sky-simple', 'floor-simple', 'house-front', 'house-side', 'roof', 'door', 'tree-single', 'bridge-front', 'gravestone', 'mushroom', 'lantern', 'candy-bucket', 'pumpkin-patch', 'fish'];
  const old = ['cover', 'ghost', 'cat', 'owl', 'spider', 'witch', 'bat'];
  const imgs = {};
  await Promise.all([...names.map(n => loadImg(A(n + '.webp')).then(i => imgs[n] = i)),
                     ...old.map(n => loadImg(A1(n + '.webp')).then(i => imgs[n] = i))]);

  /* table */
  {
    const [c, g] = canvas(1024, 1024);
    g.fillStyle = '#80502e'; g.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 420; i++) {
      const y = Math.random() * 1024, amp = Math.random() * 6, f = Math.random() * .02;
      g.strokeStyle = Math.random() < .5 ? `rgba(60,30,12,${.05 + Math.random() * .12})` : `rgba(190,130,80,${.04 + Math.random() * .08})`;
      g.lineWidth = .5 + Math.random() * 2.5; g.beginPath();
      for (let x = 0; x <= 1024; x += 16) g.lineTo(x, y + Math.sin(x * f + i) * amp);
      g.stroke();
    }
    const t = tex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 5);
    const table = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshStandardMaterial({ map: t, roughness: .55, metalness: 0 }));
    table.rotation.x = -Math.PI / 2; table.position.z = 6; table.receiveShadow = true; scene.add(table);
  }

  const cardMat = paper({ color: 0x3b2459 });

  /* floor panel */
  {
    const base = new THREE.Mesh(new THREE.BoxGeometry(W, T, D), cardMat);
    base.position.set(0, T / 2, D / 2); base.castShadow = base.receiveShadow = true; scene.add(base);
    const fimg = imgs['floor-simple'];
    const [c, g] = canvas(fimg.width, fimg.height); g.drawImage(fimg, 0, 0);
    const toPx = (x, z) => [(x + W / 2 - INSET) / (W - 2 * INSET) * c.width, (z - INSET) / (D - 2 * INSET) * c.height];
    const k = c.width / (W - 2 * INSET);
    // stepping-stone path from the front door to the card's front edge
    for (let i = 0; i < 9; i++) {
      const t = i / 8, x = HOUSE.x + .25 * Math.sin(t * 5) + .5 * t, z = HOUSE.z0 + HOUSE.d + .55 + t * (D - 1.4 - HOUSE.z0 - HOUSE.d);
      const [px, py] = toPx(x + (i % 2 ? .22 : -.22), z), rx = (.42 + Math.random() * .1) * k, ry = (.3 + Math.random() * .06) * k;
      g.fillStyle = 'rgba(60,30,80,.18)'; g.beginPath(); g.ellipse(px + 3, py + 5, rx, ry, 0, 0, 7); g.fill();
      g.fillStyle = `hsl(272,${12 + Math.random() * 8}%,${68 + Math.random() * 8}%)`; g.beginPath(); g.ellipse(px, py, rx, ry, Math.random() - .5, 0, 7); g.fill();
      g.strokeStyle = 'rgba(80,50,100,.35)'; g.lineWidth = 3; g.stroke();
      g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.ellipse(px - rx * .25, py - ry * .3, rx * .45, ry * .3, 0, 0, 7); g.fill();
    }
    // stream pixels → spots for twinkling glints
    const sd = g.getImageData(0, 0, c.width, c.height).data, spots = [];
    for (let n = 0; n < 4000 && spots.length < 14; n++) {
      const x = Math.random() * c.width | 0, y = Math.random() * c.height | 0, i = (y * c.width + x) * 4;
      if (sd[i + 2] > 170 && sd[i + 2] > sd[i] + 60) spots.push([-W / 2 + INSET + x / k, INSET + y / k]);
    }
    STREAM.spots = spots;
    const art = new THREE.Mesh(new THREE.PlaneGeometry(W - 2 * INSET, D - 2 * INSET), paper({ map: tex(c) }));
    art.rotation.x = -Math.PI / 2; art.position.set(0, FLOOR_TOP + .002, D / 2); art.receiveShadow = true; scene.add(art);
  }

  /* back panel: inside = sky with the cut slot, outside = cover */
  const back = new THREE.Group(); back.position.set(0, FLOOR_TOP + T / 2 + .012, 0); scene.add(back);
  {
    const base = new THREE.Mesh(new THREE.BoxGeometry(W, H, T), cardMat);
    base.position.y = H / 2; base.castShadow = base.receiveShadow = true; base.userData.role = 'fold'; back.add(base);

    // sky + the witch's curved slot cut into it
    const sky = imgs['sky-simple'];
    const [c, g] = canvas(1536, Math.round(1536 * (H - 2 * INSET) / (W - 2 * INSET)));
    g.drawImage(sky, 0, 0, c.width, c.height);
    const toPx = (x, y) => [(x + W / 2 - INSET) / (W - 2 * INSET) * c.width, (H - INSET - y) / (H - 2 * INSET) * c.height];
    const k = c.width / (W - 2 * INSET);
    g.lineCap = 'round';
    g.beginPath();
    for (let a = DIAL.a0; a <= DIAL.a1; a += 1) { const [px, py] = toPx(DIAL.x + DIAL.r * Math.cos(a * DEG), DIAL.y + DIAL.r * Math.sin(a * DEG)); a === DIAL.a0 ? g.moveTo(px, py) : g.lineTo(px, py); }
    g.strokeStyle = 'rgba(255,240,220,.35)'; g.lineWidth = .2 * k; g.stroke();
    g.strokeStyle = '#140a22'; g.lineWidth = .14 * k; g.stroke();
    const art = new THREE.Mesh(new THREE.PlaneGeometry(W - 2 * INSET, H - 2 * INSET), paper({ map: tex(c) }));
    art.position.set(0, H / 2, T / 2 + .003); art.receiveShadow = true; art.userData.role = 'fold'; back.add(art);

    // cover with a hand-lettered title
    const cov = imgs.cover;
    const [cc, cg] = canvas(1536, 1024);
    cg.drawImage(cov, 0, 0, 1536, 1024);
    cg.save(); cg.translate(768, 300); cg.rotate(-3 * DEG); cg.textAlign = 'center';
    cg.font = '62px Chewy'; cg.fillStyle = '#ffd27a'; cg.fillText('✦ from our spooky village ✦', 0, -120);
    cg.font = '190px Chewy'; cg.lineJoin = 'round';
    cg.lineWidth = 26; cg.strokeStyle = '#26153d'; cg.strokeText('Happy Halloween!', 0, 70);
    cg.fillStyle = '#e2711d'; cg.fillText('Happy Halloween!', 0, 82); cg.fillStyle = '#fff4dc'; cg.fillText('Happy Halloween!', 0, 70);
    cg.restore();
    const cover = new THREE.Mesh(new THREE.PlaneGeometry(W - 2 * INSET, H - 2 * INSET), paper({ map: tex(cc) }));
    cover.rotation.x = Math.PI; cover.position.set(0, H / 2, -T / 2 - .003); cover.receiveShadow = true; cover.userData.role = 'fold';
    back.add(cover);
    pick.push(base, art, cover);

    // moon dial: a paper wheel pinned to the sky; the witch rides an arm from its centre
    const [dc, dg] = canvas(512, 512);
    dg.fillStyle = '#f3e6cc'; dg.beginPath(); dg.arc(256, 256, 250, 0, 7); dg.fill();
    for (let i = 0; i < 36; i++) { dg.save(); dg.translate(256, 256); dg.rotate(i * 10 * DEG); dg.fillStyle = '#d9c6a3'; dg.fillRect(232, -6, 22, 12); dg.restore(); }
    dg.strokeStyle = '#6b3fa0'; dg.lineWidth = 10; dg.beginPath(); dg.arc(256, 256, 150, -1.2, 1.2); dg.stroke();
    dg.fillStyle = '#6b3fa0'; dg.beginPath(); dg.moveTo(256 + 150 * Math.cos(1.2) - 26, 256 + 150 * Math.sin(1.2)); dg.lineTo(256 + 150 * Math.cos(1.2) + 22, 256 + 150 * Math.sin(1.2) - 14); dg.lineTo(256 + 150 * Math.cos(1.2) + 6, 256 + 150 * Math.sin(1.2) + 30); dg.fill();
    dg.font = '120px Chewy'; dg.textAlign = 'center'; dg.textBaseline = 'middle'; dg.fillText('☾', 256, 262);
    dial = new THREE.Mesh(new THREE.CircleGeometry(1.45, 48), paper({ map: tex(dc), side: THREE.DoubleSide }));
    dial.position.set(DIAL.x, DIAL.y, T / 2 + .03); dial.castShadow = true; dial.userData.role = 'dial';
    back.add(dial); pick.push(dial);

    // witch riding the slot, with two bats tagging along
    witch = cutout(imgs.witch, 1.5, { role: 'dial' }); back.add(witch); pick.push(witch.front);
    for (let i = 0; i < 2; i++) { const b = cutout(imgs.bat, .7 - i * .15); back.add(b); bats.push(b); }
    for (let i = 0; i < 3; i++) { const b = cutout(imgs.bat, .62 + i * .1, { role: 'bat' }); back.add(b); moonBats.push(b); pick.push(b.front); }
  }
  back.userData.panel = true;
  window.__back = back;

  const popups = fold;

  /* ---------- tree (parallel layer near the back) with owl and spider ---------- */
  {
    const tree = cutout(imgs['tree-single'], 9.6); tree.position.set(-6.7, 0, 3.0); tree.rotation.y = -.42; foldTree.add(tree); blockers.push(tree.front);
    // a smaller mirrored tree on the right, angled the other way like a theatre wing
    const tree2 = cutout(imgs['tree-single'], 7.2); tree2.scale.x = -1; tree2.position.set(6.9, 0, 2.3); tree2.rotation.y = .42; foldTree.add(tree2); blockers.push(tree2.front);
    owlObj = cutout(imgs.owl, 1.25, { role: 'owl' }); owlObj.position.set(TREE.owl[0] * tree.w, TREE.owl[1] * tree.h, .05); tree.add(owlObj); pick.push(owlObj.front);
    const owlHit = hitPad(2, 2, 'owl'); owlHit.position.set(0, .6, .12); owlObj.add(owlHit);
    const anchor = new THREE.Vector3(TREE.spider[0] * tree.w, TREE.spider[1] * tree.h, .08);
    thread = new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, 1, 5), new THREE.MeshStandardMaterial({ color: 0xf2f0ff, roughness: .4 }));
    thread.geometry.translate(0, -.5, 0); thread.position.copy(anchor); tree.add(thread);
    spiderObj = cutout(imgs.spider, .8, { role: 'spider' }); spiderObj.userData.anchor = anchor; tree.add(spiderObj); pick.push(spiderObj.front);
    spiderHit = hitPad(1.1, 1, 'spider'); spiderHit.geometry.translate(0, -.5, 0); spiderHit.position.copy(anchor).add(new THREE.Vector3(0, 0, .14)); tree.add(spiderHit);
  }

  /* ---------- the house: a real box fold with walls, gable roof and chimney ---------- */
  {
    house = new THREE.Group(); house.position.set(HOUSE.x, 0, HOUSE.z0); foldHouse.add(house);
    const fimg = imgs['house-front'], hw = HOUSE.w, fh = hw * fimg.height / fimg.width, hd = HOUSE.d;
    // find where the gable meets the walls from the cut-out's silhouette
    const ad = alphaData(fimg); let maxW = 0; const rowW = [];
    for (let y = 0; y < ad.h; y++) { let n = 0; for (let x = 0; x < ad.w; x++) n += ad.a[y * ad.w + x] > 128; rowW.push(n); maxW = Math.max(maxW, n); }
    let eaveRow = rowW.findIndex(n => n > maxW * .92); if (eaveRow < 0) eaveRow = ad.h * .4;
    const wallH = fh * (1 - eaveRow / ad.h);
    HOUSE.wallH = wallH; HOUSE.fh = fh;

    const front = cutout(fimg, fh, { emissive: glowMask(fimg) }); front.position.z = hd; house.add(front); blockers.push(front.front);
    front.mat.emissiveIntensity = 1.2; HOUSE.frontMat = front.mat;
    // it now stands free of the back panel, so it needs a back wall too
    const rear = cutout(fimg, fh, { emissive: glowMask(fimg) }); rear.rotation.y = Math.PI; rear.position.z = .02; house.add(rear); HOUSE.rearMat = rear.mat;

    const simg = imgs['house-side'];
    const sideMat = paper({ map: tex(simg), emissiveMap: glowMask(simg), emissive: new THREE.Color(0xffb347), emissiveIntensity: 1.2 });
    HOUSE.sideMat = sideMat;
    for (const s of [-1, 1]) {
      const wall = new THREE.Mesh(new THREE.PlaneGeometry(hd, wallH * .985), sideMat);
      wall.rotation.y = s * Math.PI / 2; wall.position.set(s * (hw / 2 - .06), wallH / 2, hd / 2);
      wall.castShadow = wall.receiveShadow = true; house.add(wall); blockers.push(wall);
    }
    // roof slopes with overhang
    const rt = tex(imgs.roof); rt.wrapS = rt.wrapT = THREE.RepeatWrapping; rt.center.set(.5, .5); rt.rotation = Math.PI / 2; rt.repeat.set(2, 1.6);
    const roofMat = paper({ map: rt, bumpScale: .4 });
    const ridge = new THREE.Vector2(0, fh + .05), depth = hd + .8;
    for (const s of [-1, 1]) {
      const eave = new THREE.Vector2(s * (hw / 2 - .02), wallH - .02);
      const dir = eave.clone().sub(ridge).normalize(), end = eave.clone().add(dir.clone().multiplyScalar(.45));
      const len = end.distanceTo(ridge) + .05, mid = end.clone().add(ridge).multiplyScalar(.5);
      const slab = new THREE.Mesh(new THREE.BoxGeometry(len, .1, depth), roofMat);
      slab.position.set(mid.x, mid.y + .07, depth / 2 - .35); slab.rotation.z = Math.atan2(dir.y, dir.x) + (s < 0 ? Math.PI : 0);
      slab.castShadow = slab.receiveShadow = true; house.add(slab); blockers.push(slab);
    }
    // chimney on the right slope
    const cx = hw * .22, roofY = fh - (fh - wallH) * (cx / (hw / 2));
    const [sc, sg] = canvas(128, 256); sg.fillStyle = '#8f8296'; sg.fillRect(0, 0, 128, 256);
    for (let y = 0; y < 256; y += 32) for (let x = (y / 32) % 2 * -24; x < 128; x += 48) { sg.fillStyle = `hsl(275,${8 + Math.random() * 8}%,${55 + Math.random() * 12}%)`; sg.fillRect(x + 2, y + 2, 44, 28); }
    const chim = new THREE.Mesh(new THREE.BoxGeometry(.85, 2.2, .85), paper({ map: tex(sc) }));
    chim.position.set(cx, roofY + .55, 1.3); chim.castShadow = chim.receiveShadow = true; house.add(chim); blockers.push(chim);
    const hole = new THREE.Mesh(new THREE.PlaneGeometry(.62, .62), new THREE.MeshBasicMaterial({ color: 0x1a0d22 }));
    hole.rotation.x = -Math.PI / 2; hole.position.set(cx, roofY + 1.651, 1.3); house.add(hole);
    HOUSE.chimTop = roofY + 1.65; HOUSE.chimX = cx;

    // front door: a hinged flap over the painted doorway
    const dimg = imgs.door, dh = wallH * HOUSE.doorH, dw = dh * dimg.width / dimg.height;
    door = new THREE.Group(); door.position.set(HOUSE.doorX * hw - dw / 2, HOUSE.doorY * fh, hd + .03); house.add(door);
    const dpanel = cutout(dimg, dh, { role: 'door' }); dpanel.position.x = dw / 2; door.add(dpanel); pick.push(dpanel.front, dpanel.children[1]);
    HOUSE.doorW = dw;

    // little warm light inside the door
    const lamp = new THREE.PointLight(0xffa64a, 0, 5, 2); lamp.position.set(HOUSE.doorX * hw, .9, hd + .6); house.add(lamp); HOUSE.lamp = lamp;

    // ghost on a clear acetate strip, hiding in the chimney
    ghostObj = cutout(imgs.ghost, 2.3, { role: 'ghost' }); ghostObj.position.set(cx, HOUSE.chimTop - .5, 1.3); house.add(ghostObj); pick.push(ghostObj.front);
    strip = new THREE.Mesh(new THREE.PlaneGeometry(.22, 1), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: .28, roughness: .1, side: THREE.DoubleSide }));
    strip.geometry.translate(0, .5, 0); strip.position.set(cx, HOUSE.chimTop - .4, 1.3); house.add(strip);
  }

  /* ---------- black cat: waits inside until the door opens ---------- */
  catObj = cutout(imgs.cat, 1.5, { role: 'cat' }); catObj.visible = false; popups.add(catObj); pick.push(catObj.front);
  fishObj = cutout(imgs.fish, .55); fishObj.visible = false; popups.add(fishObj);
  ripple = new THREE.Mesh(new THREE.RingGeometry(.3, .4, 40), new THREE.MeshBasicMaterial({ color: 0xdff4ff, transparent: true, opacity: 0, depthWrite: false }));
  ripple.rotation.x = -Math.PI / 2; popups.add(ripple);

  /* ---------- the middle: lantern, pumpkin patch, candy bucket ---------- */
  lantern = cutout(imgs.lantern, 3.0, { emissive: glowMask(imgs.lantern, (r, g, b) => r > 225 && g > 175 && b < 170) });
  lantern.position.set(-1.75, 0, HOUSE.z0 + HOUSE.d + .6); popups.add(lantern); blockers.push(lantern.front);
  const lamp = new THREE.PointLight(0xffb050, 0, 5, 2); lamp.position.set(.25, 1.75, .4); lantern.add(lamp); lantern.userData.light = lamp;
  const patch = cutout(imgs['pumpkin-patch'], 1.3); patch.position.set(-1.5, 0, 11.2); popups.add(patch);
  bucket = cutout(imgs['candy-bucket'], 1.55, { role: 'candy' }); bucket.position.set(BUCKET.x, 0, BUCKET.z); popups.add(bucket); pick.push(bucket.front);

  /* ---------- bridge over the stream ---------- */
  {
    const bimg = imgs['bridge-front'], bw = BRIDGE.w, bh = bw * bimg.height / bimg.width;
    const front = cutout(bimg, bh); front.position.set(BRIDGE.x, 0, BRIDGE.z + BRIDGE.d / 2); foldBridge.add(front); blockers.push(front.front);
    const backFace = cutout(bimg, bh); backFace.rotation.y = Math.PI; backFace.position.set(BRIDGE.x, 0, BRIDGE.z - BRIDGE.d / 2); foldBridge.add(backFace);
    const [c, g] = canvas(256, 64); g.fillStyle = '#9d90a6'; g.fillRect(0, 0, 256, 64);
    for (let x = 0; x < 256; x += 22) { g.fillStyle = `hsl(275,10%,${50 + Math.random() * 14}%)`; g.fillRect(x + 1, 2, 20, 60); }
    const deckY = bh * BRIDGE.deck;
    const deck = new THREE.Mesh(new THREE.BoxGeometry(bw * .78, .12, BRIDGE.d), paper({ map: tex(c) }));
    deck.position.set(BRIDGE.x, deckY, BRIDGE.z); deck.castShadow = deck.receiveShadow = true; foldBridge.add(deck);
    BRIDGE.deckY = deckY; BRIDGE.h = bh;
  }

  /* ---------- gravestones & mushrooms ---------- */
  for (const [i, p] of [[-8.6, 6.4, 1.7], [8.6, 10.6, 1.55]].entries()) {
    const g = cutout(imgs.gravestone, p[2], { role: 'grave' }); g.position.set(p[0], 0, p[1]); g.userData.idx = i; popups.add(g); pick.push(g.front); graves.push(g);
  }
  for (const p of [[-8.3, 11.7, 1.0], [7.3, 11.5, 1.0]]) { const m = cutout(imgs.mushroom, p[2]); m.position.set(p[0], 0, p[1]); popups.add(m); }

  /* ---------- honeycomb paper pumpkin ---------- */
  buildPumpkin(popups);

  /* ---------- pull-tab at the front edge (slides in the floor) ---------- */
  {
    const [c, g] = canvas(256, 384);
    g.fillStyle = '#f5ead3'; g.beginPath(); g.roundRect(8, 8, 240, 368, [10, 10, 60, 60]); g.fill();
    g.strokeStyle = '#d6c3a1'; g.lineWidth = 4; g.stroke();
    g.fillStyle = '#6b3fa0'; g.beginPath(); g.moveTo(128, 330); g.lineTo(78, 255); g.lineTo(110, 255); g.lineTo(110, 190); g.lineTo(146, 190); g.lineTo(146, 255); g.lineTo(178, 255); g.fill();
    g.font = '44px Chewy'; g.textAlign = 'center'; g.fillText('pull', 128, 160);
    tab = new THREE.Mesh(new THREE.BoxGeometry(1.5, .03, 2.25), [paper({ color: 0xefe2cc }), paper({ color: 0xefe2cc }), paper({ map: tex(c) }), paper({ color: 0xefe2cc }), paper({ color: 0xefe2cc }), paper({ color: 0xefe2cc })]);
    tab.position.set(TAB.x, FLOOR_TOP + .02, D - .45); tab.castShadow = tab.receiveShadow = true; tab.userData.role = 'tab';
    scene.add(tab); pick.push(tab);
  }

  /* ---------- hint sparkles ---------- */
  const [sc, sg] = canvas(128, 128);
  const grd = sg.createRadialGradient(64, 64, 0, 64, 64, 64); grd.addColorStop(0, 'rgba(255,240,180,1)'); grd.addColorStop(.25, 'rgba(255,200,90,.6)'); grd.addColorStop(1, 'rgba(255,180,60,0)');
  sg.fillStyle = grd; sg.fillRect(0, 0, 128, 128);
  sg.fillStyle = '#fffbe8'; sg.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? 10 : 56, a = i * Math.PI / 4; sg.lineTo(64 + r * Math.cos(a), 64 + r * Math.sin(a)); } sg.fill();
  const sparkTex = tex(sc);
  const addSpark = (id, parent, pos) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: sparkTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); s.position.copy(pos); s.scale.setScalar(.9); s.userData.id = id; parent.add(s); sparkles.push(s); };
  addSpark('tab', tab, new THREE.Vector3(0, .3, .9));
  addSpark('door', door, new THREE.Vector3(HOUSE.doorW * .7, 1.1, .3));
  addSpark('wheel', wheel, new THREE.Vector3(0, .9, 0));
  addSpark('dial', dial, new THREE.Vector3(1, 1, .1));
  addSpark('spider', spiderObj, new THREE.Vector3(.4, .6, .1));
  addSpark('cat', catObj, new THREE.Vector3(.5, 1.6, .1));

  // little "?" marks over the hidden surprises
  const [qc, qg] = canvas(128, 128);
  qg.fillStyle = 'rgba(255,244,220,.95)'; qg.beginPath(); qg.arc(64, 64, 50, 0, 7); qg.fill();
  qg.lineWidth = 6; qg.strokeStyle = '#6b3fa0'; qg.stroke();
  qg.font = '78px Chewy'; qg.fillStyle = '#6b3fa0'; qg.textAlign = 'center'; qg.textBaseline = 'middle'; qg.fillText('?', 64, 70);
  const qTex = tex(qc);
  const addQ = (id, parent, pos) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: qTex, transparent: true, depthWrite: false })); s.position.copy(pos); s.scale.setScalar(.6); s.userData.id = id; s.userData.q = true; parent.add(s); sparkles.push(s); };
  addQ('owl', owlObj, new THREE.Vector3(.75, 1.45, .1));
  addQ('ghost', ghostObj, new THREE.Vector3(.9, 2.6, .1));
  addQ('grave', graves[1], new THREE.Vector3(.5, 1.85, .1));
  addQ('candy', bucket, new THREE.Vector3(.45, 1.45, .1));

  // chimney smoke puffs
  const [mc, mg] = canvas(128, 128); const mgr = mg.createRadialGradient(64, 64, 0, 64, 64, 64);
  mgr.addColorStop(0, 'rgba(235,225,250,.95)'); mgr.addColorStop(.6, 'rgba(210,195,235,.45)'); mgr.addColorStop(1, 'rgba(200,185,230,0)');
  mg.fillStyle = mgr; mg.fillRect(0, 0, 128, 128);
  const smokeTex = tex(mc);
  for (let i = 0; i < 7; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false })); house.add(s); smoke.push(s); }

  // fireflies over the grass
  const [fc, fg] = canvas(64, 64); const fgr = fg.createRadialGradient(32, 32, 0, 32, 32, 32);
  fgr.addColorStop(0, 'rgba(255,255,200,1)'); fgr.addColorStop(.3, 'rgba(220,255,120,.7)'); fgr.addColorStop(1, 'rgba(180,255,80,0)');
  fg.fillStyle = fgr; fg.fillRect(0, 0, 64, 64);
  const flyTex = tex(fc);

function buildPumpkin(parent) {

function drawFace(n) {

  const kinds = [['happy', 'happy', 'smile'], ['round', 'happy', 'smile'], ['round', 'round', 'o'], ['tri', 'tri', 'grin']][n];
  eye(380, 200, kinds[0]); eye(644, 200, kinds[1]);
  carve(ctx => {
    ctx.beginPath();

    else if (kinds[2] === 'o') ctx.ellipse(512, 350, 46, 58, 0, 0, 7);
    else { ctx.moveTo(360, 300); ctx.quadraticCurveTo(512, 480, 664, 300); ctx.lineTo(610, 330); ctx.lineTo(590, 300); ctx.lineTo(540, 340); ctx.lineTo(512, 305); ctx.lineTo(484, 340); ctx.lineTo(434, 300); ctx.lineTo(414, 330); ctx.closePath(); }
  });

/* background music: a cute, not-scary music-box waltz in E minor, synthesised and looped */
const hz = n => { const m = n.match(/^([A-G])(#?)(\d)$/); return 440 * Math.pow(2, ({ C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 }[m[1]] + (m[2] ? 1 : 0) + (m[3] - 4) * 12) / 12); };
const music = {
  on: true, started: false, gain: null, next: 0, beat: 0,
  // 16 bars of 3/4: melody per beat ('-' = hold), plus a chord per bar (bass + two plucked notes)
  mel: 'E5 G5 B5 | A5 G5 E5 | F#5 G5 A5 | B5 - - | C6 B5 A5 | G5 A5 B5 | A5 G5 F#5 | E5 - - | G5 A5 B5 | D6 C6 B5 | C6 B5 A5 | G5 - F#5 | E5 F#5 G5 | A5 B5 A5 | G5 F#5 D#5 | E5 - -'.split('|').map(b => b.trim().split(' ')),
  chords: [['E3', 'G4', 'B4'], ['A2', 'A4', 'C5'], ['D3', 'F#4', 'A4'], ['B2', 'D#4', 'A4'], ['A2', 'C5', 'E5'], ['E3', 'G4', 'B4'], ['B2', 'D#4', 'A4'], ['E3', 'G4', 'B4'],
           ['G2', 'B4', 'D5'], ['D3', 'F#4', 'A4'], ['A2', 'C5', 'E5'], ['E3', 'G4', 'B4'], ['E3', 'G4', 'B4'], ['A2', 'A4', 'C5'], ['B2', 'D#4', 'A4'], ['E3', 'G4', 'B4']],

    setInterval(() => this.schedule(), 120);

  update() { if (!this.gain) return; const c = actx(); this.gain.gain.setTargetAtTime(this.on && !muted ? .5 : 0, c.currentTime, .4); },

  bats.forEach((b, i) => { const p = wpos(S.dial + (i ? .13 : -.1)); b.position.copy(p).add(new THREE.Vector3(0, i ? .9 : -.6 + Math.sin(time * 3 + i) * .2, .02)); b.scale.y = .75 + .25 * Math.abs(Math.sin(time * 9 + i * 2)); });

  // pumpkin: honeycomb fans open with the card, glows from inside
  const fan = smooth(clamp((S.alpha - 8) / 78));
  PUMP.ribs.forEach((r, i) => r.rotation.y = (i / PUMP.N) * Math.PI * 2 * fan);
  PUMP.face.visible = fan > .92; PUMP.face.scale.setScalar(clamp((fan - .92) / .08));
  PUMP.top.forEach(o => o.scale.setScalar(Math.max(.01, fan)));
  wheel.visible = fan > .9;
  S.glow += (1 - S.glow) * dt * 1.5;
  const flick = .9 + .1 * Math.sin(time * 13) * Math.sin(time * 7.3);
  pumpkinLight.intensity = 9 * S.glow * flick * open;
  PUMP.ribMats.forEach(m => m.emissiveIntensity = .12 * S.glow * flick * open);
  faceMat.emissiveIntensity = 1.3 * S.glow * flick;
  pumpkin.scale.set(1 + (S.glow - 1) * .06, 1 - (S.glow - 1) * .04, 1 + (S.glow - 1) * .06);
  if (S.wheelSnap !== undefined && !(drag && drag.role === 'wheel')) { const d = S.wheelSnap - S.wheel; S.wheel += d * Math.min(1, dt * 10); wheel.rotation.y = -S.wheel; if (Math.abs(d) < .001) S.wheelSnap = undefined; }

  // house windows flicker while the card is mid-way, then settle
  const mid = Math.sin(clamp(S.alpha / 90) * Math.PI);
  const wf = 1.25 * (1 - mid * .5 * (Math.sin(time * 23) > .3 ? 1 : 0)) * (.4 + .6 * open);
  const candle = .9 + .1 * Math.sin(time * 7.1) * Math.sin(time * 3.3);
  HOUSE.frontMat.emissiveIntensity = HOUSE.sideMat.emissiveIntensity = HOUSE.rearMat.emissiveIntensity = wf * candle;
  lantern.mat.emissiveIntensity = 1.4 * candle * (.4 + .6 * open); lantern.userData.light.intensity = 5 * candle * open;

  // owl & gravestones wobble
  if (S.owlT > 0) { S.owlT = Math.max(0, S.owlT - dt * 1.3); owlObj.rotation.z = Math.sin((1 - S.owlT) * Math.PI * 5) * .3 * S.owlT; owlObj.scale.y = 1 - .25 * Math.max(0, Math.sin((1 - S.owlT) * Math.PI * 6)) * S.owlT; }
  graves.forEach((g, i) => { if (S.graveT[i] > 0) { S.graveT[i] = Math.max(0, S.graveT[i] - dt * 1.5); g.rotation.z = Math.sin((1 - S.graveT[i]) * Math.PI * 6) * .2 * S.graveT[i]; g.position.y = Math.abs(Math.sin((1 - S.graveT[i]) * Math.PI * 3)) * .5 * S.graveT[i]; } });

  // owl blinks and the ticklish gravestone wiggles every so often (clues)
  if (S.owlT === 0) { owlObj.scale.y = (time % 4.2) < .16 ? .8 : 1; owlObj.rotation.z = Math.sin(time * .9) * .07; }
  if (S.graveT[1] === 0 && time > (S.nextGrave ??= time + 3)) { S.graveT[1] = .35; S.nextGrave = time + 6; }

  // ambient life: moon bats, smoke, fireflies, falling leaves, stream glints
  moonBats.forEach((b, i) => {
    const dir = i % 2 ? 1 : -1; S.batPh[i] += dt * (.55 + i * .12) * (1 + 3 * (S.batBoost || 0)) * dir; const a = S.batPh[i] + i * 2.1, r = (2.1 + i * .55) * (1 + .35 * (S.batBoost || 0));
    b.position.set(MOON.x + Math.cos(a) * r * 1.35, MOON.y - .3 + Math.sin(a) * r * .7, T / 2 + .05 + i * .01);
    b.scale.set(-Math.sin(a) * dir > 0 ? 1 : -1, .7 + .3 * Math.abs(Math.sin(time * 10 + i)), 1);
  });
  smoke.forEach((s, i) => {
    const t = (time * .22 + i / smoke.length) % 1;
    s.position.set(HOUSE.chimX + Math.sin(t * 5 + i) * .22 + t * .7, HOUSE.chimTop + .15 + t * 2.6, 1.3);
    s.scale.setScalar(.35 + t * 1.1); s.material.opacity = .5 * (1 - t) * smooth(clamp(t * 6)) * open;
  });
  flies.forEach(f => {
    const b = f.userData.base, ph = f.userData.ph;
    f.position.set(b.x + Math.sin(time * .5 + ph) * .7, b.y + Math.sin(time * .8 + ph * 2) * .35, b.z + Math.cos(time * .4 + ph) * .7);
    f.material.opacity = open * Math.pow(Math.max(0, Math.sin(time * 1.6 + ph * 3)), 2);
  });
  leaves.forEach(l => {
    const u = l.userData, t = (time / 8 + u.ph) % 1;
    l.position.set(u.x0 + Math.sin(t * 9 + u.ph * 6) * .45 + t * 1.6, Math.max(.04, u.y0 * (1 - t * 1.15)), 3.4 + t * 2.6);
    const landed = u.y0 * (1 - t * 1.15) <= .04;
    l.rotation.set(landed ? -Math.PI / 2 : Math.sin(t * 7) * .9, 0, t * 9);
    l.material.opacity = open * (t < .08 ? t / .08 : t > .9 ? (1 - t) / .1 : 1);
  });
  glints.forEach(g => { g.material.opacity = open * Math.pow(Math.max(0, Math.sin(time * 2.2 + g.userData.ph * 4)), 6); });

  // hint sparkles pulse (only once the card is open)
  sparkles.forEach((s, i) => {
    if (s.userData.q) { s.material.opacity = open; s.position.y += Math.sin(time * 3 + i) * .004; return; }
    s.material.opacity = open * (.55 + .45 * Math.sin(time * 4 + i)); s.scale.setScalar(.7 + .25 * Math.sin(time * 4 + i));
  });
  if (S.catMode !== 'idle') sparkles.forEach(s => { if (s.userData.id === 'cat') s.material.opacity = 0; });

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

build().then(() => {
  document.getElementById('loading').style.opacity = 0;
  setTimeout(() => document.getElementById('loading').remove(), 700);
  requestAnimationFrame(tick);
});
window.__S = S;
</script>
